<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="back.js" defer ></script>
</head>
<body>
    <div class="background">
    <div class="background1">
        <h1>My Expenses</h1>
        <p>Total Spent</p>
        <h1 class="amount">₹ <span id="total">0</span></h1>
    </div>

    <div class="background2">
        <form>
            <br>
            <label for="addexpensename">Transaction Name:</label>

            <input type="text" id="addexpensename" >
            <br>
            <label for="addamount">Transaction Amount:</label>

            <input type="text" id="addamount" >
            <br>
            <button type ="submit" id="submit">Add Expense</button>
        </form>
    </div>
    <div class="background3">
        <input type="text" id="search" placeholder="&#128269 Search Expenses..."/>
        <select class="category">
            <option class="category">Category:All</option>
            <option class="category">Category:Food</option>
            <option class="category">Category:Transport</option>
            <option class="category">Category:Entertainment</option>
            <option class="category">Category:Other</option>
        </select>
        <select class="date">
            <option class="date">Date Range:This Month</option>
            <option class="date">Date Range:Last 6 Months</option>
            <option class="date">Date Range:Last Year</option>
            
        </select>
        <select class="filter">
            <option>Filter by:</option>
            <option class="filter">Filter by:Amount</option>
            <option class="filter">Filter by:Category</option>
            <option class="filter">Filter by:Date</option>
        </select>
    </div>
</div>

<div id="listContainer">

</div>
</body>
</html>
