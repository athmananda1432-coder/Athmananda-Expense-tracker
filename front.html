<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="back.js" defer></script>
</head>
<body>
  <header class="background1">
    <h1>My Expenses</h1>
    <p style="text-align: center;">Total Spent</p>
    <h1 class="amount">₹ <span id="total">0.00</span></h1>
  </header>

  <main>
    <section class="background2">
      <form id="expenseForm">
        <div class="form-row">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="Ex: Grocery shopping" required>
        </div>

        <div class="form-row">
          <label for="addamount">Amount(₹)</label>
          <input type="number" id="addamount" placeholder="0.00" min="0.01" step="0.01" required>
        </div>

        <div class="form-row">
          <label for="categorySelect">Category</label>
          <select id="categorySelect" required>
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-row">
          <label for="expenseDate">Date</label>
          <input type="date" id="expenseDate" required>
        </div>

        <input type="hidden" id="editId" value="">

        <div class="form-actions">
          <button type="submit" id="submit">＋ Add Expense</button>
          <button type="button" id="cancelBtn" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="background3">
      <input type="text" id="search" placeholder="🔍 Search...">
      <select id="filterCategory">
        <option value="all">Filter: All</option>
        <option value="Food">Category: Food</option>
        <option value="Transport">Category: Transport</option>
        <option value="Entertainment">Category: Entertainment</option>
        <option value="Shopping">Category: Shopping</option>
        <option value="Bills">Category: Bills</option>
        <option value="Other">Category: Other</option>
      </select>
    </section>

    <section id="listContainer1" aria-label="Expense list">
      
    </section>

    <p id="emptyState" class="empty-state" hidden></p>
  </main>
</body>
</html>
